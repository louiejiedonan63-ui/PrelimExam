<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f1">
	<title>Sign in</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17231e;
			--muted: #64736b;
			--line: #d8ded8;
			--paper: #fff;
			--green: #176b50;
			--green-dark: #10533e;
			--lime: #d8ef8b;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			color: var(--ink);
			background-color: #f4f6f1;
			background-image: radial-gradient(#d5ddd4 0.7px, transparent 0.7px);
			background-size: 18px 18px;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		.login {
			width: min(100%, 440px);
			padding: 42px;
			border: 1px solid #e4e9e2;
			border-radius: 8px;
			background: var(--paper);
			box-shadow: 0 18px 55px rgb(30 54 41 / 9%);
			animation: arrive 420ms ease-out both;
		}

		.mark {
			width: 42px;
			height: 42px;
			display: grid;
			place-items: center;
			margin-bottom: 32px;
			border-radius: 8px;
			color: var(--green-dark);
			background: var(--lime);
			font-size: 21px;
			font-weight: 700;
		}

		h1 {
			margin: 0 0 8px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 34px;
			font-weight: 500;
		}

		.intro {
			margin: 0 0 30px;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.5;
		}

		.field { margin-bottom: 19px; }

		label {
			display: block;
			margin-bottom: 8px;
			font-size: 13px;
			font-weight: 700;
		}

		input {
			width: 100%;
			min-height: 48px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 5px;
			outline: none;
			color: var(--ink);
			background: #fff;
			font: inherit;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #98a39c; }

		input:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgb(23 107 80 / 13%);
		}

		.options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 2px 0 25px;
			font-size: 13px;
		}

		.remember {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			cursor: pointer;
		}

		.remember input {
			width: 16px;
			min-height: 16px;
			margin: 0;
			accent-color: var(--green);
		}

		a { color: var(--green); font-weight: 700; text-decoration: none; }
		a:hover { text-decoration: underline; }

		button {
			width: 100%;
			min-height: 50px;
			border: 0;
			border-radius: 5px;
			color: white;
			background: var(--green);
			font: inherit;
			font-size: 15px;
			font-weight: 700;
			cursor: pointer;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:hover { background: var(--green-dark); }
		button:active { transform: translateY(1px); }
		button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #94b85a; outline-offset: 3px; }

		.signup {
			margin: 24px 0 0;
			color: var(--muted);
			font-size: 13px;
			text-align: center;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 480px) {
			.login { padding: 32px 25px; }
			h1 { font-size: 30px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="login">
		<div class="mark" aria-hidden="true">D</div>
		<h1>Welcome back</h1>
		<p class="intro">Sign in to continue to your account.</p>

		<form action="#" method="get">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
			</div>

			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>

			<button type="submit">Sign in</button>
		</form>

		<p class="signup">New here? <a href="#create-account">Create an account</a></p>
	</main>
</body>
</html>
